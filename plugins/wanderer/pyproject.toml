[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-wanderer"
version = "0.1.0"
description = "Alliance Auth integration for the Wanderer EVE mapping tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan R. Olds" }]
dependencies = [
    "allianceauth>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["wanderer*"]
