events {}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Allow reasonably large uploads (e.g. admin imports).
    client_max_body_size 20m;

    # Docker's embedded DNS. Re-resolving the upstream at runtime (via the
    # $aa_upstream variable in proxy_pass below) means recreating the gunicorn
    # container — e.g. after a rebuild — does NOT require restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location = /favicon.ico { access_log off; log_not_found off; }

        location /static {
            alias /var/www/myauth/static;
            autoindex off;
        }

        location /robots.txt {
            alias /var/www/myauth/static/robots.txt;
        }

        location / {
            set $aa_upstream allianceauth_gunicorn;
            proxy_pass http://$aa_upstream:8000;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_redirect off;
        }
    }
}
